build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Get Dependencies & Install Pods
        working-directory: mobile_app
        run: |
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: Build iOS Application (.app)
        working-directory: mobile_app
        run: |
          flutter build ios --release --no-codesign
