name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub web interface

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14 # Apple Silicon macOS runner on GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build iOS App (.app)
        working-directory: mobile_app
        run: |
          flutter build ios --release --no-codesign

      - name: Package .app into .ipa
        working-directory: mobile_app
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr ApexSignage.ipa Payload
          cd ../../..
          echo "IPA created successfully at mobile_app/build/ios/ipa/ApexSignage.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexSignage-iOS-IPA
          path: mobile_app/build/ios/ipa/ApexSignage.ipa
          retention-days: 14
