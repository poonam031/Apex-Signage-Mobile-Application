name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Setup iOS Configs
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter build ios --config-only

      - name: Build iOS IPA
        working-directory: mobile_app
        run: |
          flutter build ipa --no-codesign || flutter build ios --release --no-codesign

      - name: Ensure IPA Packaging
        working-directory: mobile_app
        run: |
          if [ -f "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ] || [ -d "build/ios/iphoneos/Runner.app" ]; then
            mkdir -p build/ios/ipa/Payload
            if [ -d "build/ios/iphoneos/Runner.app" ]; then
              cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            else
              cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
            fi
            cd build/ios/ipa
            zip -qr ApexSignage.ipa Payload
            cd ../../..
          fi
          ls -la build/ios/ipa/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexSignage-iOS-IPA
          path: mobile_app/build/ios/ipa/ApexSignage.ipa
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexSignage-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
